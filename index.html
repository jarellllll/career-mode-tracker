<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Career Mode Tracker</title>
<style>
:root{--bg:#0b0d12;--panel:#141820;--panel2:#1b202a;--text:#f4f6f8;--muted:#9da6b5;--line:#2a3140;--accent:#4f8cff;--good:#42c883;--bad:#ef6262}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font-family:Inter,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
button,input,select{font:inherit}button{cursor:pointer}.app{max-width:1200px;margin:auto;padding:18px}
header{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;margin-bottom:18px}
h1,h2,h3{margin:0}.sub{color:var(--muted);font-size:13px;margin-top:4px}
.btn{border:1px solid var(--line);background:var(--panel);color:var(--text);padding:10px 14px;border-radius:9px}.btn.primary{background:var(--accent);border-color:var(--accent)}
.nav{display:flex;gap:7px;overflow:auto;margin-bottom:18px}.nav button{white-space:nowrap}
.card{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:16px;margin-bottom:14px}
.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}.kpi{font-size:25px;font-weight:800}.label{font-size:12px;color:var(--muted);margin-top:3px}
.form{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}.field{display:grid;gap:5px}.field.full{grid-column:1/-1}.field label{font-size:12px;color:var(--muted)}
input,select{width:100%;background:var(--bg);border:1px solid var(--line);color:var(--text);border-radius:8px;padding:10px;min-height:42px}
.tablewrap{overflow:auto;border:1px solid var(--line);border-radius:10px}.table{border-collapse:collapse;width:100%;min-width:760px}.table th,.table td{padding:10px 12px;border-bottom:1px solid var(--line);text-align:left;font-size:13px}.table th{color:var(--muted);font-size:12px}.table th button{background:none;border:0;color:inherit;font-weight:700}
.actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}
.scoreline{display:grid;grid-template-columns:1fr 100px 1fr;gap:10px;align-items:center}.scoreline input{text-align:center;font-size:22px;font-weight:800}
.statsgrid{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}.stat{border:1px solid var(--line);border-radius:9px;padding:10px}.stat label{display:block;color:var(--muted);font-size:11px;margin-bottom:5px}
.xi{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}.slot{background:var(--panel2);border:1px solid var(--line);border-radius:10px;padding:10px}.slot strong{display:block;font-size:12px;margin-bottom:7px}.slot select{margin-bottom:7px}.rating{width:100%}
.notice{color:var(--muted);font-size:13px}.empty{padding:25px;text-align:center;color:var(--muted);border:1px dashed var(--line);border-radius:10px}
@media(max-width:720px){.grid,.form,.statsgrid,.xi{grid-template-columns:1fr 1fr}.scoreline{grid-template-columns:1fr 80px 1fr}}
@media(max-width:480px){.grid,.form,.statsgrid,.xi{grid-template-columns:1fr}.app{padding:12px}}
</style>
</head>
<body>
<div class="app">
<header>
<div><h1 id="title">Career Mode Tracker</h1><div class="sub" id="subtitle">Start a new career and build your save.</div></div>
<div class="actions"><button class="btn primary" id="newGame">Enter New Game</button><button class="btn" id="export">Export Save</button><button class="btn" id="importBtn">Import Save</button><input id="file" type="file" accept="application/json" hidden></div>
</header>
<div class="nav" id="nav"></div>
<main id="main"></main>
</div>
<script>
const blank=()=>({club:"",manager:"",season:"2026/27",players:[],matches:[],targets:[],transfers:[],competitions:[],tactics:[],staff:[],awards:[]});
let db=JSON.parse(localStorage.getItem("careerModeSave")||"null")||blank(), page="Dashboard", sort={key:null,dir:0};
const pages=["Dashboard","Squad","Matches","Transfers","Competitions","Tactics","Staff","Awards","Analytics","Records"];
const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const num=x=>Number.isFinite(+x)?+x:0;
function persist(){localStorage.setItem("careerModeSave",JSON.stringify(db))}
function id(){return Date.now()+Math.random().toString(16).slice(2)}
function nav(){document.querySelector("#nav").innerHTML=pages.map(p=>`<button class="btn ${p===page?"primary":""}" data-page="${p}">${p}</button>`).join("");document.querySelectorAll("[data-page]").forEach(b=>b.onclick=()=>{page=b.dataset.page;sort={key:null,dir:0};render()})}
function form(fields,button){return `<form class="form" id="form">${fields.map(f=>`<div class="field ${f.full?"full":""}"><label>${esc(f.label)}</label>${f.type==="select"?`<select name="${f.name}">${f.options.map(x=>`<option>${esc(x)}</option>`).join("")}</select>`:`<input name="${f.name}" type="${f.type||"text"}" placeholder="${esc(f.placeholder||"")}" ${f.required?"required":""}></div>`).join("")}<div class="field full"><button class="btn primary" type="submit">${button}</button></div></form>`}
function table(rows,cols,key){if(!rows.length)return `<div class="empty">Nothing here yet.</div>`;let a=[...rows];if(sort.key&&sort.dir)a.sort((x,y)=>{let A=x[sort.key],B=y[sort.key],aa=+A,bb=+B;let c=!Number.isNaN(aa)&&!Number.isNaN(bb)?aa-bb:String(A??"").localeCompare(String(B??""));return c*sort.dir});return `<div class="tablewrap"><table class="table"><thead><tr>${cols.map(c=>`<th><button data-sort="${c.k}">${esc(c.l)} ${sort.key===c.k?(sort.dir===-1?"↓":"↑"):""}</button></th>`).join("")}<th></th></tr></thead><tbody>${a.map(r=>`<tr>${cols.map(c=>`<td>${esc(r[c.k])}</td>`).join("")}<td><button class="btn" data-delete="${key}" data-id="${r.id}">Delete</button></td></tr>`).join("")}</tbody></table></div>`}
function dash(){return `<div class="card">${!db.club?`${form([{name:"club",label:"Club you're managing",required:true,placeholder:"Enter club name"},{name:"manager",label:"Manager name"},{name:"season",label:"Starting season",placeholder:"2026/27"}],"Create Career")}`:`<div class="grid"><div class="card"><div class="kpi">${db.players.length}</div><div class="label">Players</div></div><div class="card"><div class="kpi">${db.matches.length}</div><div class="label">Matches</div></div><div class="card"><div class="kpi">${db.targets.length}</div><div class="label">Transfer targets</div></div><div class="card"><div class="kpi">${db.awards.length}</div><div class="label">Awards</div></div></div><div class="notice">Use Matches to enter a full match in one form: result, possession, shots, shots on target, fouls, corners, formation, tactics and your XI ratings.</div>`}</div>`}
function squad(){return `<div class="card"><h2>Add Player</h2><div class="sub">First team, youth and academy players are all user-entered.</div>${form([{name:"name",label:"Player name",required:true},{name:"position",label:"Position"},{name:"type",label:"Squad type",type:"select",options:["First Team","Youth","Academy","Loaned In","Loaned Out"]},{name:"dob",label:"Date of birth",type:"date"},{name:"number",label:"Squad number",type:"number"},{name:"overall",label:"Overall",type:"number"}],"Add Player")}</div><div class="card"><h2>Squad</h2>${table(db.players,[{k:"name",l:"Player"},{k:"position",l:"Position"},{k:"type",l:"Squad"},{k:"overall",l:"OVR"},{k:"starts",l:"Starts"},{k:"subs",l:"Subs"},{k:"minutes",l:"Minutes"},{k:"goals",l:"Goals"},{k:"assists",l:"Assists"},{k:"motm",l:"MOTM"}],"players")}</div>`}
function match(){let p=db.players.map(x=>x.name);let formations=["4-3-3","4-2-3-1","4-4-2","3-4-2-1","3-5-2","5-3-2","Custom"];return `<div class="card"><h2>Enter Match</h2><div class="sub">One match form captures the team stats and your starting XI. Player minutes can be refined through substitutions in a later update.</div>${form([{name:"date",label:"Date",type:"date",required:true},{name:"competition",label:"Competition",required:true,placeholder:"Premier League"},{name:"opponent",label:"Opponent",required:true},{name:"venue",label:"Venue",type:"select",options:["Home","Away","Neutral"]},{name:"formation",label:"Formation",type:"select",options:formations},{name:"tactic",label:"Tactic",placeholder:"Possession / Counter / High Press"},{name:"result",label:"Result",type:"select",options:["Win","Draw","Loss"]},{name:"homeGoals",label:"Our goals",type:"number"},{name:"awayGoals",label:"Opponent goals",type:"number"},{name:"possession",label:"Possession %",type:"number"},{name:"shots",label:"Shots",type:"number"},{name:"shotsOn",label:"Shots on target",type:"number"},{name:"fouls",label:"Fouls",type:"number"},{name:"corners",label:"Corners",type:"number"},{name:"offsides",label:"Offsides",type:"number"},{name:"yellow",label:"Yellow cards",type:"number"},{name:"red",label:"Red cards",type:"number"},{name:"motm",label:"Man of the Match",type:"select",options:["None",...p]}],"Continue to Starting XI")}</div><div class="card" id="xiCard" style="display:none"></div><div class="card"><h2>Recorded Matches</h2>${table(db.matches,[{k:"date",l:"Date"},{k:"competition",l:"Competition"},{k:"opponent",l:"Opponent"},{k:"formation",l:"Formation"},{k:"tactic",l:"Tactic"},{k:"result",l:"Result"},{k:"score",l:"Score"},{k:"possession",l:"Possession"},{k:"shots",l:"Shots"},{k:"shotsOn",l:"SOT"},{k:"fouls",l:"Fouls"},{k:"corners",l:"Corners"},{k:"motm",l:"MOTM"}],"matches")}</div>`}
function generic(){let cfg={Transfers:[["targets","Transfer Target","Player","club","Current club","position","Position","status","Status","priority","Priority"],["transfers","Completed Transfer","Player","club","Club","fee","Fee","direction","Direction","date","Date"]],Competitions:[["competitions","Competition","name","Name","type","Type","season","Season","status","Status","finish","Finish"]],Tactics:[["tactics","Tactic","name","Name","formation","Formation","style","Style","notes","Notes"]],Staff:[["staff","Staff","name","Name","role","Role","specialty","Specialty","joined","Joined"]],Awards:[["awards","Award","award","Award","winner","Winner","category","Category","competition","Competition","season","Season"]]}[page];let key=cfg[0],title=cfg[1],fields=[];for(let i=2;i<cfg.length;i+=2)fields.push({name:cfg[i],label:cfg[i+1]});return `<div class="card"><h2>${title}</h2>${form(fields,"Add")}</div><div class="card">${table(db[key],fields.map(f=>({k:f.name,l:f.label})),key)}</div>`}
function analytics(){let p=db.players,formations={},tactics={};db.matches.forEach(m=>{if(m.formation)formations[m.formation]=(formations[m.formation]||0)+1;if(m.tactic)tactics[m.tactic]=(tactics[m.tactic]||0)+1});const list=o=>Object.entries(o).sort((a,b)=>b[1]-a[1]).map(x=>`<div class="card"><b>${esc(x[0])}</b><div class="sub">${x[1]} matches</div></div>`).join("")||"<div class='empty'>No match data yet.</div>";return `<div class="card"><h2>Most used formations</h2>${list(formations)}</div><div class="card"><h2>Most used tactics</h2>${list(tactics)}</div><div class="card"><h2>Player performance</h2>${table(p,[{k:"name",l:"Player"},{k:"starts",l:"Starts"},{k:"subs",l:"Subs"},{k:"minutes",l:"Minutes"},{k:"goals",l:"Goals"},{k:"assists",l:"Assists"},{k:"motm",l:"MOTM"}],"players")}</div>`}
function records(){let p=db.players;let top=(k)=>[...p].sort((a,b)=>num(b[k])-num(a[k]))[0];let g=top("goals"),m=top("motm"),s=top("subs");return `<div class="grid"><div class="card"><b>Top scorer</b><div class="kpi">${g&&num(g.goals)?esc(g.name):"—"}</div><div class="label">${g?num(g.goals)+" goals":"No data"}</div></div><div class="card"><b>Most MOTMs</b><div class="kpi">${m&&num(m.motm)?esc(m.name):"—"}</div><div class="label">${m?num(m.motm)+" MOTM":"No data"}</div></div><div class="card"><b>Most substitute apps</b><div class="kpi">${s&&num(s.subs)?esc(s.name):"—"}</div><div class="label">${s?num(s.subs)+" subs":"No data"}</div></div><div class="card"><b>Youngest debut</b><div class="kpi">Auto</div><div class="label">Calculated from DOB + debut date when both are entered.</div></div></div>`}
function render(){nav();document.querySelector("#title").textContent=db.club||"Career Mode Tracker";document.querySelector("#subtitle").textContent=db.club?`${db.manager?db.manager+" · ":""}${db.season}`:"Start a new career and build your save.";let fn={Dashboard:dash,Squad:squad,Matches:match,Transfers:generic,Competitions:generic,Tactics:generic,Staff:generic,Awards:generic,Analytics:analytics,Records:records};document.querySelector("#main").innerHTML=fn[page]();bind()}
function bind(){let f=document.querySelector("#form");if(f)f.onsubmit=e=>{e.preventDefault();let d=Object.fromEntries(new FormData(f));if(page==="Dashboard"){db.club=d.club;db.manager=d.manager;db.season=d.season||"2026/27"}else if(page==="Squad"){db.players.push({id:id(),...d,starts:0,subs:0,minutes:0,goals:0,assists:0,motm:0})}else if(page==="Matches"){showXI(d)}else{let map={Transfers:d,Competitions:d,Tactics:d,Staff:d,Awards:d};let key={Transfers:d.direction?"transfers":"targets",Competitions:"competitions",Tactics:"tactics",Staff:"staff",Awards:"awards"}[page];db[key].push({id:id(),...d})}persist();if(page!=="Matches")render()};document.querySelectorAll("[data-delete]").forEach(b=>b.onclick=()=>{db[b.dataset.delete]=db[b.dataset.delete].filter(x=>String(x.id)!==String(b.dataset.id));persist();render()});document.querySelectorAll("[data-sort]").forEach(b=>b.onclick=()=>{let k=b.dataset.sort;if(sort.key!==k)sort={key:k,dir:-1};else sort.dir=sort.dir===-1?1:0;render()})}
function showXI(matchData){let card=document.querySelector("#xiCard"),positions=["GK","RB","CB","CB","LB","CM","CM","RW","AM","LW","ST"],opts=db.players.map(p=>`<option value="${esc(p.name)}">${esc(p.name)}</option>`).join("");card.style.display="block";card.innerHTML=`<h2>${esc(matchData.formation)} — Starting XI</h2><div class="sub">Select a player for each position and enter their rating. You can leave a slot blank.</div><div class="xi">${positions.map((pos,i)=>`<div class="slot"><strong>${pos}</strong><select data-xi-player="${i}"><option value="">Select player</option>${opts}</select><input class="rating" data-xi-rating="${i}" type="number" min="0" max="10" step=".1" placeholder="Rating"></div>`).join("")}</div><div class="actions"><button class="btn primary" id="saveMatch">Save Match</button><button class="btn" id="cancelMatch">Cancel</button></div>`;document.querySelector("#cancelMatch").onclick=()=>{card.style.display="none"};document.querySelector("#saveMatch").onclick=()=>{let xi=[...card.querySelectorAll("[data-xi-player]")].map((s,i)=>({position:positions[i],player:s.value,rating:num(card.querySelector(`[data-xi-rating="${i}"]`).value)})).filter(x=>x.player);let score=`${num(matchData.homeGoals)}-${num(matchData.awayGoals)}`;let rec={id:id(),...matchData,score,xi};db.matches.push(rec);xi.forEach(x=>{let p=db.players.find(y=>y.name===x.player);if(p){p.starts=num(p.starts)+1;p.minutes=num(p.minutes)+90;if(x.rating>=8)p.motm=num(p.motm)+(matchData.motm===p.name?1:0)}});let motm=db.players.find(p=>p.name===matchData.motm);if(motm)motm.motm=num(motm.motm)+1;persist();render()}}
document.querySelector("#newGame").onclick=()=>{if(confirm("Start a new empty career? This will replace the current save in this browser.")){db=blank();persist();page="Dashboard";render()}};document.querySelector("#export").onclick=()=>{let a=document.createElement("a");a.href=URL.createObjectURL(new Blob([JSON.stringify(db,null,2)],{type:"application/json"}));a.download=(db.club||"career-save")+".json";a.click();setTimeout(()=>URL.revokeObjectURL(a.href),500)};document.querySelector("#importBtn").onclick=()=>document.querySelector("#file").click();document.querySelector("#file").onchange=e=>{let f=e.target.files[0];if(!f)return;let r=new FileReader();r.onload=()=>{try{let x=JSON.parse(r.result);if(!x.players||!x.matches)throw Error();db={...blank(),...x};persist();render()}catch{alert("Invalid career save.")}};r.readAsText(f)};
render();
</script>
</body>
</html>
